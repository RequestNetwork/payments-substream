# Per-chain EVM ERC20FeeProxy indexing config for the slim D' Substreams -> Postgres pull.
#
# No endpoints and no tokens here (those are provider/token concerns, set per chain in
# sinks/chains.env and never committed to this repo -- see docs/contract.md).
#
# Fields:
#   schema               Postgres schema the sink writes into (DSN schemaName=, request-api
#                         chain name with hyphens converted to underscores)
#   request_api_chain    chain identifier used by request-api (src/constants/chains.ts
#                         PayeeDestinationNetworkName) and in PAYMENTS_SOURCE_<CHAIN>
#   substreams_network   `network:` value used by the Substreams endpoint for this chain
#   initial_block        lowest ERC20FeeProxy deployment block across the addresses below
#   addresses            ERC20FeeProxy contract addresses to filter on (lowercase 0x); an
#                         indexer must filter on address AND topic0 -- delegatecalling
#                         contracts (conversion proxy, escrow, transferable receivable) emit
#                         the same topic0 and stay on Hasura
#   topic0                TransferWithReferenceAndFee(address,address,uint256,bytes,uint256,address)
#                         event signature hash (same for every chain)

