services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: payments-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Renamed from postgres_data (created by postgres:15) so postgres:17 starts on a fresh
      # volume instead of refusing the old data directory. The old one can be removed by hand.
      - payments_pg17_data:/var/lib/postgresql/data
      # Creates the per-chain schemas on a fresh volume (`sink postgres setup` needs them)
      - ./sinks/local-init.sql:/docker-entrypoint-initdb.d/10-schemas.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Substreams Postgres sink supervisor (one sink per chain in CHAINS)
  sink:
    build:
      context: .
      dockerfile: Dockerfile.sink
    container_name: payments-sink
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAINS: ${CHAINS:-tron}
      SUBSTREAMS_SINK_DSN: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/payments?sslmode=disable
      SUBSTREAMS_API_TOKEN: ${SUBSTREAMS_API_TOKEN}

volumes:
  payments_pg17_data:
