[package]
name = "request-network-evm"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/RequestNetwork/payments-substream"
license = "MIT"
description = "Request Network EVM Substreams module for ERC20FeeProxy payment detection"

[lib]
name = "request_network_evm"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5"
substreams-database-change = "1.3"
prost = "0.11"
prost-types = "0.11"
hex = "0.4"
anyhow = "1.0"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
